<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>계획표 & 일정 달력 v1.10</title>

  <!-- ===== PWA 관련 태그 (추가됨) ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="계획표">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- ================================== -->

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top, 0px));
      padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
      background: #ffffff; color: #333; position: relative; min-height: 100%;
    }
    .calendar-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; position: relative; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; }
    .header h2 { font-size: 1.5rem; color: #2c3e50; cursor: pointer; padding: 4px 12px; border-radius: 6px; transition: 0.2s; user-select: none; }
    .header h2:hover { background: #e2e8f0; color: #1a202c; }
    .header button { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s ease; }
    .header button:hover { background: #2980b9; transform: translateY(-1px); }
    .header button:active { transform: translateY(0) scale(0.97); }

    /* 연/월 선택 드롭다운 팝업 */
    .ym-picker-popover {
      display: none;
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 50;
      width: 320px;
      padding: 16px;
    }
    .ym-picker-popover.active { display: flex; gap: 12px; }
    .ym-column { flex: 1; display: flex; flex-direction: column; }
    .ym-column-title { font-size: 0.85rem; font-weight: bold; color: #64748b; margin-bottom: 8px; text-align: center; }
    
    .ym-list-scroll { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    
    .ym-grid-month { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 6px; 
      max-height: 200px; 
      overflow-y: auto; 
      padding-right: 2px;
    }

    .ym-btn {
      width: 100%;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      color: #334155;
      text-align: center;
      transition: 0.15s;
    }
    .ym-btn:hover { background: #edf2f7; border-color: #cbd5e1; }
    .ym-btn.selected { background: #3498db; color: #ffffff; border-color: #3498db; }

    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px 10px; text-align: center; }
    .day-header { font-weight: bold; padding: 10px 0; color: #7f8c8d; border-bottom: 1px solid #eef1f6; margin-bottom: 4px; }
    .day-header.sun { color: #e74c3c; }
    .day-header.sat { color: #2980b9; }
    
    .day { 
      height: 110px; 
      border-radius: 8px; 
      padding: 6px 4px; 
      cursor: pointer; 
      text-align: left; 
      transition: 0.2s; 
      position: relative; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .day:hover { background: #f7f9fc; }
    .day.today .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3498db;
      color: #fff !important;
      font-weight: 800;
    }

    .day-number { font-weight: bold; margin-bottom: 2px; font-size: 0.9rem; color: #2c3e50; flex-shrink: 0; }
    .day.sun .day-number, .day.holiday .day-number { color: #e74c3c; }
    .day.sat .day-number { color: #2980b9; }

    .badge-holiday {
      display: block;
      font-size: 0.7rem;
      padding: 1px 4px;
      border-radius: 3px;
      margin-bottom: 2px;
      background-color: #fde8e8;
      color: #e74c3c;
      font-weight: bold;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .plan-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background-color: #f1c40f;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(241, 196, 15, 0.8);
      z-index: 2;
    }

    .badge-event { 
      display: block; 
      font-size: 0.73rem; 
      padding: 2px 5px; 
      border-radius: 4px; 
      margin-top: 2px; 
      text-overflow: ellipsis; 
      overflow: hidden; 
      white-space: nowrap; 
      color: white;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-more {
      display: block;
      font-size: 0.7rem;
      padding: 1px 4px;
      margin-top: 2px;
      color: #64748b;
      font-weight: bold;
      background: #f1f5f9;
      border-radius: 3px;
      text-align: center;
      flex-shrink: 0;
    }

    /* 모달 레이아웃 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.32);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      justify-content: center; align-items: center; z-index: 100;
      animation: overlayFadeIn 0.18s ease;
    }
    @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPopIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal {
      background: white; width: 92%; max-width: 580px; max-height: 92vh;
      border-radius: 18px; padding: 24px; display: flex; flex-direction: column;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
      animation: modalPopIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-header { font-size: 1.25rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; transition: color 0.15s ease, transform 0.15s ease; border-radius: 50%; width: 32px; height: 32px; }
    .close-btn:hover { color: #333; background: #f1f5f9; }
    .close-btn:active { transform: scale(0.9); }
    
    .mode-select { display: flex; gap: 10px; margin-bottom: 15px; }
    .mode-btn { flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; border-radius: 8px; font-weight: bold; color: #64748b; transition: 0.2s ease; }
    .mode-btn:hover { border-color: #94a3b8; }
    .mode-btn.active { background: #3498db; color: white; border-color: #3498db; box-shadow: 0 4px 10px rgba(52,152,219,0.25); }
    .modal-body { overflow-y: auto; flex: 1; padding-right: 5px; }

    /* 날짜 클릭 시 먼저 뜨는 미리보기 창 */
    .preview-panel {
      display: none;
      flex-direction: column;
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.65);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      border: 1px solid rgba(203, 213, 225, 0.5);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      animation: previewSlideDown 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes previewSlideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .preview-panel .modal-body { max-height: 260px; }
    .preview-section-title { font-size: 0.8rem; font-weight: bold; color: #64748b; margin: 14px 0 6px; }
    .preview-section-title:first-child { margin-top: 0; }
    .preview-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.7); border-radius: 10px; margin-bottom: 6px; border-left: 4px solid #3498db; transition: background 0.15s ease; }
    .preview-item:hover { background: rgba(255,255,255,0.95); }
    .preview-item-title { font-weight: bold; font-size: 0.9rem; color: #1e293b; }
    .preview-item-sub { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
    .preview-empty { text-align: center; color: #94a3b8; padding: 32px 10px; font-size: 0.9rem; }
    .preview-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(203, 213, 225, 0.6); }
    .preview-btn { flex: none; width: auto; padding: 10px 16px; font-size: 0.85rem; }
    .preview-btn.event-btn { background: #3498db; }
    .preview-btn.event-btn:hover { background: #2980b9; }
    .preview-btn.plan-btn { background: #9b59b6; }
    .preview-btn.plan-btn:hover { background: #8e44ad; }

    /* 폼 스타일 */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #475569; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .form-control:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.15); }
    .time-range { display: flex; gap: 8px; align-items: center; }
    .time-range input { flex: 1; }

    /* 색상 선택기 */
    .color-options { display: flex; gap: 8px; margin-top: 4px; }
    .color-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s ease, border-color 0.15s ease; }
    .color-btn:hover { transform: scale(1.12); }
    .color-btn.selected { border-color: #333; transform: scale(1.1); }

    /* 버튼 그룹 */
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .submit-btn { flex: 1; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.18s ease; }
    .submit-btn:hover { background: #27ae60; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(46,204,113,0.25); }
    .submit-btn:active { transform: translateY(0) scale(0.97); box-shadow: none; }
    .save-plan-btn { background: #3498db; }
    .save-plan-btn:hover { background: #2980b9; }
    .save-close-btn { background: #9b59b6; }
    .save-close-btn:hover { background: #8e44ad; }
    .cancel-btn { background: #94a3b8; width: 100%; margin-top: 5px; }
    .cancel-btn:hover { background: #64748b; }

    /* 원형 계획표 SVG 차트 영역 */
    .chart-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      background: #fafafa;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #edf2f7;
    }
    .clock-svg { width: 100%; max-width: 450px; height: auto; }

    /* 리스트 스타일 */
    .item-list { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid #3498db; transition: background 0.15s ease; }
    .list-item:hover { background: #f1f5f9; }
    .list-item-content { flex: 1; }
    .list-item-title { font-weight: bold; font-size: 0.95rem; color: #1e293b; }
    .list-item-sub { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
    .item-actions { display: flex; gap: 8px; align-items: center; }
    .edit-btn { color: #3498db; cursor: pointer; font-weight: bold; font-size: 0.85rem; padding: 2px 6px; border-radius: 4px; background: #ebf8ff; }
    .edit-btn:hover { background: #bee3f8; }
    .delete-btn { color: #ef4444; cursor: pointer; font-weight: bold; font-size: 1.1rem; padding-left: 4px; }
    .delete-btn:hover { color: #dc2626; }

    .version-tag {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-size: 0.8rem;
      color: #a0aec0;
      font-weight: 600;
      user-select: none;
    }

    /* ===== 모바일 반응형 (휴대폰 화면용, 추가됨) ===== */
    @media (max-width: 600px) {
      body { padding: 8px; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
      .calendar-container { padding: 12px; border-radius: 10px; }

      .header { margin-bottom: 12px; }
      .header h2 { font-size: 1.05rem; padding: 4px 6px; }
      .header button { padding: 7px 10px; font-size: 0.8rem; }

      .grid { gap: 10px 6px; }
      .day-header { padding: 6px 0; font-size: 0.75rem; }
      .day { height: 68px; padding: 3px 4px; border-radius: 6px; }
      .day-number { font-size: 0.75rem; margin-bottom: 1px; }

      .badge-holiday, .badge-event, .badge-more { font-size: 0.55rem; padding: 1px 3px; }
      .plan-dot { width: 6px; height: 6px; bottom: 3px; right: 3px; }

      .ym-picker-popover { width: min(300px, 92vw); left: 50%; padding: 12px; }
      .ym-btn { font-size: 0.68rem; height: 30px; }

      .modal { width: 96%; padding: 16px; max-height: 94vh; }
      .modal-header { font-size: 1.1rem; margin-bottom: 10px; }
      .mode-btn { padding: 9px; font-size: 0.85rem; }

      .form-group { margin-bottom: 9px; }
      .form-control { padding: 9px 10px; font-size: 1rem; } /* iOS 확대 방지: 16px 이상 권장 */
      .color-btn { width: 26px; height: 26px; }

      .clock-svg { max-width: 320px; }
      .list-item { padding: 9px; }
      .list-item-title { font-size: 0.9rem; }
      .list-item-sub { font-size: 0.75rem; }

      .version-tag { font-size: 0.7rem; bottom: 8px; right: 10px; }
    }

    @media (max-width: 360px) {
      .day { height: 58px; }
      .header h2 { font-size: 0.95rem; }
      .header button { padding: 6px 8px; font-size: 0.75rem; }
    }
    /* =============================================== */
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="header">
      <button onclick="changeMonth(-1)">&lt; 이전</button>
      <h2 id="monthYear" onclick="toggleYmPicker(event)" title="클릭하여 년/월 이동"></h2>
      <button onclick="changeMonth(1)">다음 &gt;</button>

      <!-- 연/월 선택 팝업 -->
      <div class="ym-picker-popover" id="ymPicker">
        <div class="ym-column">
          <div class="ym-column-title">년도 선택</div>
          <div class="ym-list-scroll" id="ymYearList"></div>
        </div>
        <div class="ym-column">
          <div class="ym-column-title">월 선택</div>
          <div class="ym-grid-month" id="ymMonthGrid"></div>
        </div>
      </div>
    </div>

    <div class="grid" id="calendarGrid"></div>

    <!-- 미리보기 창 (날짜 클릭 시 달력 바로 아래에 반투명하게 펼쳐짐) -->
    <div class="preview-panel" id="previewModalOverlay">
      <div class="modal-header">
        <span id="previewModalTitle">날짜 선택</span>
        <button class="close-btn" onclick="closePreviewModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div id="previewContent"></div>
      </div>

      <div class="preview-footer">
        <button class="submit-btn preview-btn event-btn" onclick="openManageModal('event')">일정 관리</button>
        <button class="submit-btn preview-btn plan-btn" onclick="openManageModal('plan')">계획 관리</button>
      </div>
    </div>

    <div class="version-tag">v1.10</div>
  </div>
  <!-- 모달 구조 -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle">날짜 선택</span>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="mode-select">
        <button class="mode-btn active" id="btnModeEvent" onclick="switchMode('event')">일정 관리</button>
        <button class="mode-btn" id="btnModePlan" onclick="switchMode('plan')">24시간 계획표</button>
      </div>

      <div class="modal-body">
        <!-- 일정 관리 섹션 -->
        <div id="eventSection">
          <div class="form-group">
            <label>일정 제목</label>
            <input type="text" id="eventTitle" class="form-control" placeholder="일정 제목을 입력하세요">
          </div>
          <div class="form-group">
            <label>시간</label>
            <div class="time-range">
              <input type="time" id="eventStartTime" class="form-control">
              <span>~</span>
              <input type="time" id="eventEndTime" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label>장소 / 위치</label>
            <input type="text" id="eventLocation" class="form-control" placeholder="장소를 입력하세요">
          </div>
          <div class="form-group">
            <label>메모</label>
            <input type="text" id="eventMemo" class="form-control" placeholder="추가 메모">
          </div>
          <div class="form-group">
            <label>색상 선택</label>
            <div class="color-options" id="eventColorPicker">
              <div class="color-btn selected" style="background: #3498db;" data-color="#3498db"></div>
              <div class="color-btn" style="background: #e74c3c;" data-color="#e74c3c"></div>
              <div class="color-btn" style="background: #2ecc71;" data-color="#2ecc71"></div>
              <div class="color-btn" style="background: #f39c12;" data-color="#f39c12"></div>
              <div class="color-btn" style="background: #9b59b6;" data-color="#9b59b6"></div>
              <div class="color-btn" style="background: #34495e;" data-color="#34495e"></div>
            </div>
          </div>
          <button class="submit-btn" onclick="addEvent()">일정 추가하기</button>

          <div class="item-list" id="eventList"></div>
        </div>

        <!-- 24시간 계획표 섹션 -->
        <div id="planSection" style="display: none;">
          <div class="form-group">
            <label>계획 내용</label>
            <input type="text" id="planTitle" class="form-control" placeholder="할 일 / 계획 내용 입력">
          </div>
          <div class="form-group">
            <label>시간 설정 (분 단위 지정)</label>
            <div class="time-range">
              <input type="time" id="planStartTime" class="form-control" value="09:00">
              <span>~</span>
              <input type="time" id="planEndTime" class="form-control" value="10:00">
            </div>
          </div>
          <div class="form-group">
            <label>계획 색상 선택</label>
            <div class="color-options" id="planColorPicker">
              <div class="color-btn selected" style="background: #9b59b6;" data-color="#9b59b6"></div>
              <div class="color-btn" style="background: #3498db;" data-color="#3498db"></div>
              <div class="color-btn" style="background: #e74c3c;" data-color="#e74c3c"></div>
              <div class="color-btn" style="background: #2ecc71;" data-color="#2ecc71"></div>
              <div class="color-btn" style="background: #f39c12;" data-color="#f39c12"></div>
              <div class="color-btn" style="background: #16a085;" data-color="#16a085"></div>
              <div class="color-btn" style="background: #e67e22;" data-color="#e67e22"></div>
            </div>
          </div>

          <div class="btn-group">
            <button class="submit-btn save-plan-btn" id="btnPlanSave" onclick="savePlan(false)">계획 저장</button>
            <button class="submit-btn save-close-btn" id="btnPlanSaveClose" onclick="savePlan(true)">계획 저장 및 닫기</button>
          </div>
          <button class="submit-btn cancel-btn" id="btnPlanCancel" onclick="resetPlanForm()" style="display: none;">수정 취소</button>

          <div class="chart-container">
            <svg class="clock-svg" id="clockSvg" viewBox="0 0 320 200"></svg>
          </div>

          <div class="item-list" id="planList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDateStr = "";
    let selectedEventColor = "#3498db";
    let selectedPlanColor = "#9b59b6";
    let editingPlanIndex = -1;
    let storageData = JSON.parse(localStorage.getItem("calendarData")) || {};

    const fixedHolidays = {

    function toggleYmPicker(e) {
      e.stopPropagation();
      const popover = document.getElementById('ymPicker');
      const isActive = popover.classList.contains('active');
      
      if (!isActive) {
        renderYmPicker();
        popover.classList.add('active');
      } else {

      }

    function renderYmPicker() {
      const yearListEl = document.getElementById('ymYearList');
      const monthGridEl = document.getElementById('ymMonthGrid');
      
      yearListEl.innerHTML = "";
      monthGridEl.innerHTML = "";

      const currentY = currentDate.getFullYear();
      const currentM = currentDate.getMonth() + 1;

      for (let y = 1950; y <= 2050; y++) {
        const btn = document.createElement('button');
        btn.className = `ym-btn ${y === currentY ? 'selected' : ''}`;
        btn.innerText = `${y}년`;
        btn.onclick = (e) => {
          e.stopPropagation();
          currentDate.setFullYear(y);
          renderCalendar();
          renderYmPicker();
        };
        yearListEl.appendChild(btn);
      }

      setTimeout(() => {
        const selectedBtn = yearListEl.querySelector('.selected');
        if (selectedBtn) selectedBtn.scrollIntoView({ block: 'center' });
      }, 0);

      for (let m = 1; m <= 12; m++) {
        const btn = document.createElement('button');
        btn.className = `ym-btn ${m === currentM ? 'selected' : ''}`;
        btn.innerText = `${m}월`;
        btn.onclick = (e) => {
          e.stopPropagation();
          currentDate.setMonth(m - 1);
          renderCalendar();
          document.getElementById('ymPicker').classList.remove('active');
        };
        monthGridEl.appendChild(btn);
      }
    }

    function renderCalendar() {
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("monthYear").innerText = `${year}년 ${month + 1}월`;

      const daysOfWeek = ["일", "월", "화", "수", "목", "금", "토"];
      daysOfWeek.forEach((day, index) => {
        const header = document.createElement("div");
        header.className = "day-header";
        if (index === 0) header.classList.add("sun");
        if (index === 6) header.classList.add("sat");
        header.innerText = day;
        grid.appendChild(header);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();
        const holidayName = getHolidayName(dateStr);

        const dayEl = document.createElement("div");
        let classNames = ["day"];
        
        if (dateStr === todayStr) classNames.push("today");
        if (dayOfWeek === 0) classNames.push("sun");
        if (dayOfWeek === 6) classNames.push("sat");
        if (holidayName) classNames.push("holiday");

        dayEl.className = classNames.join(" ");
        dayEl.onclick = () => openModal(dateStr);

        const numEl = document.createElement("div");
        numEl.className = "day-number";
        numEl.innerText = day;
        dayEl.appendChild(numEl);

        if (holidayName) {
          const holidayBadge = document.createElement("span");
          holidayBadge.className = "badge-holiday";
          holidayBadge.innerText = holidayName;
          dayEl.appendChild(holidayBadge);
        }

        if (storageData[dateStr]) {
          const events = storageData[dateStr].events || [];
          const plans = storageData[dateStr].plans || [];

          const maxVisible = holidayName ? 1 : 2;

          events.slice(0, maxVisible).forEach(ev => {
            const badge = document.createElement("span");
            badge.className = "badge-event";
            badge.style.backgroundColor = ev.color || "#3498db";
            badge.innerText = ev.title;
            dayEl.appendChild(badge);
          });

          if (events.length > maxVisible) {
            const moreBadge = document.createElement("span");
            moreBadge.className = "badge-more";
            moreBadge.innerText = `... (+${events.length - maxVisible}개)`;
            dayEl.appendChild(moreBadge);
          }

          if (plans.length > 0) {
            const dot = document.createElement("div");
            dot.className = "plan-dot";
            dayEl.appendChild(dot);
          }
        }

        grid.appendChild(dayEl);
      }
    }

        title: title,

    function savePlan(shouldClose = false) {

      const endTime = document.getElementById("planEndTime").value;

      if (!title) return alert("계획 내용을 입력하세요.");

      const planData = { 
        title, 
        startTime, 
        endTime, 
        color: selectedPlanColor || "#9b59b6" 
      };

      if (!storageData[selectedDateStr].plans) {
        storageData[selectedDateStr].plans = [];
      }

      if (editingPlanIndex >= 0) {
        storageData[selectedDateStr].plans[editingPlanIndex] = planData;
      } else {
        storageData[selectedDateStr].plans.push(planData);
      }

      storageData[selectedDateStr].plans.sort((a, b) => a.startTime.localeCompare(b.startTime));
      saveData();

      resetPlanForm();
      renderPlans();

      if (shouldClose) {
        closeModal();

    function renderClockChart(plans) {
      const svg = document.getElementById("clockSvg");
      svg.innerHTML = "";

      const cx = 160, cy = 100, r = 70;

      const bgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bgCircle.setAttribute("cx", cx);
      bgCircle.setAttribute("cy", cy);
      bgCircle.setAttribute("r", r);
      bgCircle.setAttribute("fill", "#ffffff");
      bgCircle.setAttribute("stroke", "#cbd5e1");
      bgCircle.setAttribute("stroke-width", "2");
      svg.appendChild(bgCircle);

      function timeToAngle(timeStr) {
        const [h, m] = timeStr.split(":").map(Number);
        const totalMinutes = h * 60 + m;
        return (totalMinutes / 1440) * 360 - 90;
      }

      function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
        const angleInRadians = (angleInDegrees * Math.PI) / 180.0;
        return {
          x: centerX + radius * Math.cos(angleInRadians),
          y: centerY + radius * Math.sin(angleInRadians)
        };
      }

      function describeArc(x, y, radius, startAngle, endAngle) {
        let diff = endAngle - startAngle;
        if (diff < 0) diff += 360;
        if (diff >= 360) diff = 359.999;

        const start = polarToCartesian(x, y, radius, startAngle);
        const end = polarToCartesian(x, y, radius, startAngle + diff);
        const largeArcFlag = diff > 180 ? "1" : "0";

        return [
          "M", x, y,
          "L", start.x, start.y,
          "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y,
          "Z"
        ].join(" ");
      }

      plans.forEach(pl => {
        if (!pl.startTime || !pl.endTime) return;
        const startAngle = timeToAngle(pl.startTime);
        let endAngle = timeToAngle(pl.endTime);

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", describeArc(cx, cy, r, startAngle, endAngle));
        path.setAttribute("fill", pl.color || "#9b59b6");
        path.setAttribute("opacity", "0.75");
        path.setAttribute("stroke", "#ffffff");
        path.setAttribute("stroke-width", "1");

        const titleTag = document.createElementNS("http://www.w3.org/2000/svg", "title");
        titleTag.textContent = `${pl.title} (${pl.startTime} ~ ${pl.endTime})`;
        path.appendChild(titleTag);

        svg.appendChild(path);

        let diffAngle = endAngle - startAngle;
        if (diffAngle < 0) diffAngle += 360;
        const midAngle = startAngle + (diffAngle / 2);

        const startPos = polarToCartesian(cx, cy, r - 5, midAngle);
        const midPos = polarToCartesian(cx, cy, r + 12, midAngle);

        const isRight = Math.cos((midAngle * Math.PI) / 180) >= 0;
        const lineEndPt = { x: midPos.x + (isRight ? 14 : -14), y: midPos.y };
        const textPt = { x: midPos.x + (isRight ? 18 : -18), y: midPos.y + 3 };

        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("points", `${startPos.x},${startPos.y} ${midPos.x},${midPos.y} ${lineEndPt.x},${lineEndPt.y}`);
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", pl.color || "#475569");
        polyline.setAttribute("stroke-width", "1.2");
        polyline.setAttribute("stroke-linecap", "round");
        svg.appendChild(polyline);

        const labelText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        labelText.setAttribute("x", textPt.x);
        labelText.setAttribute("y", textPt.y);
        labelText.setAttribute("text-anchor", isRight ? "start" : "end");
        labelText.setAttribute("font-size", "8.5");
        labelText.setAttribute("font-weight", "600");
        labelText.setAttribute("fill", "#334155");
        labelText.textContent = pl.title.length > 7 ? pl.title.substring(0, 7) + ".." : pl.title;
        svg.appendChild(labelText);
      });

      const hoursLabels = [
        { hour: 0, label: "00" },
        { hour: 3, label: "03" },
        { hour: 6, label: "06" },
        { hour: 9, label: "09" },
        { hour: 12, label: "12" },
        { hour: 15, label: "15" },
        { hour: 18, label: "18" },
        { hour: 21, label: "21" }
      ];

      for (let h = 0; h < 24; h++) {
        const angle = (h / 24) * 360 - 90;
        const p1 = polarToCartesian(cx, cy, r - 4, angle);
        const p2 = polarToCartesian(cx, cy, r, angle);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p1.x);
        line.setAttribute("y1", p1.y);
        line.setAttribute("x2", p2.x);
        line.setAttribute("y2", p2.y);
        line.setAttribute("stroke", h % 3 === 0 ? "#475569" : "#cbd5e1");
        line.setAttribute("stroke-width", h % 3 === 0 ? "1.5" : "1");
        svg.appendChild(line);
      }

      hoursLabels.forEach(item => {
        const angle = (item.hour / 24) * 360 - 90;
        const pos = polarToCartesian(cx, cy, r - 12, angle);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", pos.x);
        text.setAttribute("y", pos.y + 3);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "8");
        text.setAttribute("font-weight", "bold");
        text.setAttribute("fill", "#64748b");
        text.textContent = item.label;
        svg.appendChild(text);
      });

      const centerDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      centerDot.setAttribute("cx", cx);
      centerDot.setAttribute("cy", cy);
      centerDot.setAttribute("r", "2.5");
      centerDot.setAttribute("fill", "#475569");
      svg.appendChild(centerDot);
    }

    function saveData() {
      localStorage.setItem("calendarData", JSON.stringify(storageData));
    }

    renderCalendar();
  </script>
